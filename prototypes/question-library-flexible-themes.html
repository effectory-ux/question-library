<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question library - Themes - My Effectory</title>
  <base href="../" />
  <link rel="expect" href="#page-script" blocking="render" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="foundation.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="toolbar/prototype-bar.css" />
  <link rel="stylesheet" href="prototypes/question-library-toolbar.css" />
  <script src="prototypes/question-library-shared.js"></script>
</head>
<body data-page="themes-topics">
<script src="prototypes/question-library-toolbar.js"></script>
<script src="toolbar/load.js"></script>

<div class="app">

  <!-- SIDEBAR -->
  <div class="mainnav">
    <div class="mn-portal">
      <span class="mn-logo"></span>
      <button class="mn-portal-btn"><b>Coordinator</b> <i data-icon="chevron-down" class="mn-chev"></i></button>
    </div>
    <nav class="mn-nav" aria-label="Main">
      <a class="mn-item"><i data-icon="home"></i> Home</a>
      <a class="mn-item"><i data-icon="clipboard"></i> Surveys <i data-icon="chevron-down" class="mn-chev"></i></a>
      <a class="mn-item is-active" aria-current="page"><i data-icon="book-open"></i> Question library</a>
      <a class="mn-item"><i data-icon="refresh"></i> 360&deg; Feedback</a>
      <a class="mn-item"><i data-icon="structure"></i> Organization <i data-icon="chevron-down" class="mn-chev"></i></a>
    </nav>
    <div class="mn-foot">
      <a class="mn-item"><i data-icon="help"></i> Help &amp; learn</a>
      <div class="mn-foot-divider"></div>
      <div class="mn-user">
        <div class="av av-36 av-blue">JR</div>
        <div class="mn-meta">
          <div class="mn-name">Jamal van Rooijen</div>
          <div class="mn-org">Effectory B.V.</div>
        </div>
        <i data-icon="chevron-up"></i>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main class="app-main">


    <div class="app-main-inner">

      <!-- Page header -->
      <div class="ph">
        <div class="ph-row">
          <div class="ph-left">
            <div class="ph-title-row">
              <h1 class="ph-title">Question library</h1>
              <span class="tag tag-info">Beta</span>
            </div>
            <div class="ph-meta">Manage the questions you can ask in your surveys</div>
          </div>
          <div class="ph-controls">
            <button class="btn btn-primary" id="btnPublish"><i data-icon="send"></i> Publish</button>
          </div>
        </div>
        <div class="ph-tabs">
          <a class="ph-tab" href="prototypes/question-library-flexible-questions.html">Questions</a>
          <a class="ph-tab" href="prototypes/question-library-flexible-templates.html">Templates</a>
          <a class="ph-tab is-active" aria-current="page" href="prototypes/question-library-flexible-themes.html">Themes</a>
        </div>
        <div class="ph-divider"></div>
      </div>


      <!-- Toolbar -->
      <div class="ql-toolbar">
        <div class="slt-wrap ql-lang">
          <div class="slt-lbl">Library languages <i data-icon="info" data-tt="The languages this project's question library is available in"></i></div>
          <div class="slt" tabindex="0" role="button" aria-haspopup="listbox">
            <span class="slt-left"><span class="slt-val"></span></span>
            <i data-icon="chevron-down"></i>
          </div>
        </div>
        <div class="search-wrap">
          <span class="search-icon"><i data-icon="search"></i></span>
          <input type="search" class="srch" id="qlSearch" placeholder="Search for specific questions" aria-label="Search for specific questions" />
        </div>
        <button class="btn btn-secondary" id="btnCollapse"><i data-icon="double-chevron-up"></i> Collapse all</button>
      </div>

      <!-- Themes & topics accordion -->
      <div class="acc" id="setList"></div>
      <p class="text-medium" id="noResults" hidden style="color: var(--content-secondary); margin: 0;">No questions match your search.</p>

    </div>
  </main>
</div>

<script src="icons.js"></script>
<script id="page-script">
(function () {
  "use strict";
  var list = document.getElementById("setList");
  var noResults = document.getElementById("noResults");
  var searchEl = document.getElementById("qlSearch");
  var collapseBtn = document.getElementById("btnCollapse");
  var term = "";

  function videoBlock() {
    return '<div class="ql-video">' +
      '<button class="ib ib-36 ib-secondary" data-video aria-label="Watch video" data-tt="Watch video"><i data-icon="play"></i></button>' +
      "</div>";
  }

  function setCard(name, kind, questions, desc) {
    var shown = term ? questions.filter(function (q) { return QL.matches(q, term); }) : questions;
    if (term && !shown.length) return "";
    var rows = shown.map(function (q) {
      return '<div class="ql-qrow text-medium"><span class="q-text">' + QL.hl(q, term) + "</span></div>";
    }).join("");
    var about = desc ?
      '<div class="ql-about"><div class="text-medium">' +
      desc.map(function (p) { return "<p>" + QL.esc(p) + "</p>"; }).join("") +
      "</div>" + videoBlock() + "</div>" : "";
    return '<div class="acc-item is-open">' +
      '<button class="acc-header" aria-expanded="true">' +
      '<span class="acc-title">' + QL.esc(name) + "</span>" +
      '<span class="acc-meta">' + questions.length + " questions</span>" +
      '<span class="chip-sm">' + kind + "</span>" +
      '<span class="ib ib-24 ib-tertiary" data-rename role="button" tabindex="0" aria-label="Rename" data-tt="Rename"><i data-icon="edit"></i></span>' +
      '<i data-icon="chevron-down" class="acc-chevron"></i>' +
      "</button>" +
      '<div class="acc-body"><div class="acc-body-inner">' + about +
      '<h3 class="text-l5" style="margin: 0 0 var(--spacing-extra-tight); color: var(--content-base);">Questions</h3>' +
      rows +
      "</div></div></div>";
  }

  function render() {
    var html =
      QL.THEMES.map(function (t) { return setCard(t.name, "Theme", t.qs, t.desc); }).join("");
    list.innerHTML = html;
    noResults.hidden = !!html.trim();
    bind();
    if (window.Icons) window.Icons.render();
    updateCollapseLabel();
  }

  function bind() {
    list.querySelectorAll(".acc-header").forEach(function (h) {
      h.addEventListener("click", function (e) {
        if (e.target.closest("[data-video]") || e.target.closest("[data-rename]")) return;
        var item = h.closest(".acc-item");
        item.classList.toggle("is-open");
        h.setAttribute("aria-expanded", item.classList.contains("is-open"));
        updateCollapseLabel();
      });
    });
    list.querySelectorAll("[data-video]").forEach(function (b) {
      b.addEventListener("click", function (e) { e.stopPropagation(); QL.videoDialog(); });
    });
    list.querySelectorAll("[data-rename]").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        var header = b.closest(".acc-header");
        var old = header.querySelector(".acc-title").textContent;
        var kind = header.querySelector(".chip-sm").textContent.toLowerCase();
        QL.renameDialog(old, kind, function (name) {
          QL.THEMES.concat(QL.TOPICS).forEach(function (set) { if (set.name === old) set.name = name; });
          render();
        });
      });
    });
  }

  function updateCollapseLabel() {
    var items = list.querySelectorAll(".acc-item");
    var anyOpen = Array.prototype.some.call(items, function (i) { return i.classList.contains("is-open"); });
    collapseBtn.innerHTML = anyOpen ?
      '<i data-icon="double-chevron-up"></i> Collapse all' :
      '<i data-icon="double-chevron-down"></i> Expand all';
    collapseBtn.setAttribute("data-open", anyOpen);
    if (window.Icons) window.Icons.render();
  }

  collapseBtn.addEventListener("click", function () {
    var anyOpen = collapseBtn.getAttribute("data-open") === "true";
    list.querySelectorAll(".acc-item").forEach(function (i) {
      i.classList.toggle("is-open", !anyOpen);
      i.querySelector(".acc-header").setAttribute("aria-expanded", !anyOpen);
    });
    updateCollapseLabel();
  });

  searchEl.addEventListener("input", function () {
    term = searchEl.value.trim();
    render();
  });

  render();
})();
</script>
</body>
</html>
