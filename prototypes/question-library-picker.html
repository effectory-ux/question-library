<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add questions - Engagement survey Q4 - My Effectory</title>
  <base href="../" />
  <link rel="expect" href="#page-script" blocking="render" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="foundation.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="prototypes/question-library-cq.css" />
  <link rel="stylesheet" href="toolbar/prototype-bar.css" />
  <link rel="stylesheet" href="prototypes/question-library-toolbar.css" />
  <script src="prototypes/question-library-shared.js"></script>
  <script src="prototypes/question-library-cq.js"></script>
  <style>
    /* the survey creator's picker: two shelves — Effectory's catalog and the
       organisation's own collection — plus the creator's personal questions */
    .app-main-inner { max-width: calc(960px + 2 * var(--page-x)); }
    .pick-row .btn { flex: none; }
    .pick-row .tag { flex: none; }
    #pickList .q-row[data-added], #orgList .q-row[data-added], #mineList .q-row[data-added] { background: var(--bg-secondary); }
    .cc-meta { display: block; margin-top: var(--spacing-extra-tight); font-size: 12px; color: var(--content-secondary); }
  </style>
</head>
<body data-page="picker" data-variant="split">
<script src="prototypes/question-library-toolbar.js"></script>
<script src="toolbar/load.js"></script>

<div class="app">
  <main class="app-main" style="width: 100%;">

    <!-- survey-creation context: this is a layer inside a survey, not the library -->
    <nav class="breadcrumb" aria-label="Back">
      <button class="btn btn-secondary" id="btnBack"><i data-icon="arrow-left"></i> Back to survey</button>
      <ol class="bc-trail">
        <li><span class="bc-current" aria-current="page">Engagement survey Q4 2026 — Add questions</span></li>
      </ol>
    </nav>

    <div class="app-main-inner">

      <div class="ph">
        <div class="ph-row">
          <div class="ph-left">
            <h1 class="ph-title">Add questions</h1>
            <div class="ph-meta">From the Effectory library or your organisation’s own questions</div>
          </div>
        </div>
        <div class="ph-tabs">
          <a class="tab is-active" role="tab" id="tabLib" data-shelf="lib">Effectory library</a>
          <a class="tab" role="tab" id="tabOrg" data-shelf="org">Your organisation <span id="orgCount"></span></a>
          <a class="tab" role="tab" id="tabMine" data-shelf="mine">My questions <span id="mineCount"></span></a>
        </div>
        <div class="ph-divider"></div>
      </div>

      <div class="ql-toolbar">
        <div class="search-wrap" style="margin-left: 0; width: 320px;">
          <span class="search-icon"><i data-icon="search"></i></span>
          <input type="search" class="srch" id="pkSearch" placeholder="Search" aria-label="Search questions" />
        </div>
        <span style="flex: 1;"></span>
        <button class="btn btn-secondary" id="btnWrite" hidden><i data-icon="plus"></i> Write a new question</button>
      </div>

      <div id="pickList"></div>
      <div id="orgList" hidden></div>
      <div id="mineList" hidden></div>
      <p class="text-medium" id="noResults" hidden style="color: var(--content-secondary); margin: 0;">No questions match your search.</p>

    </div>
  </main>
</div>

<script src="icons.js"></script>
<script id="page-script">
(function () {
  "use strict";
  /* Fixed version downstream: Effectory's structure untouched; the
     organisation's available custom questions on their own shelf; and the
     creator's personal questions — usable right away, visible to everyone
     only once the coordinator makes them available. */
  var all = QL.customQuestions();
  var org = all.filter(function (c) { return c.avail !== false; });
  var mine = all.filter(function (c) { return (c.by || "You") === "You"; });
  var added = {};
  var term = "", shelf = "lib";
  var pickList = document.getElementById("pickList");
  var orgList = document.getElementById("orgList");
  var mineList = document.getElementById("mineList");
  var noResults = document.getElementById("noResults");
  var btnWrite = document.getElementById("btnWrite");
  function counts() {
    document.getElementById("orgCount").textContent = "(" + org.length + ")";
    document.getElementById("mineCount").textContent = "(" + mine.length + ")";
  }
  counts();

  function row(q, tag, meta) {
    var key = QL.fill(q.text);
    return '<div class="q-row pick-row"' + (added[key] ? " data-added" : "") + '>' +
      '<div class="text-medium text-w500 q-text" style="flex:1;">' + QL.hl(q.text, term) +
      (meta ? '<span class="cc-meta text-w400">' + QL.esc(meta) + "</span>" : "") + "</div>" +
      tag + QL.scaleChip(q.type) +
      (added[key]
        ? '<button class="btn btn-secondary is-disabled" disabled>Added</button>'
        : '<button class="btn btn-secondary" data-add="' + QL.esc(key) + '">Add</button>') +
      "</div>";
  }

  function render() {
    pickList.hidden = shelf !== "lib";
    orgList.hidden = shelf !== "org";
    mineList.hidden = shelf !== "mine";
    btnWrite.hidden = shelf !== "mine";
    var any = false;
    if (shelf === "lib") {
      pickList.innerHTML = QL.TOPICS.map(function (topic) {
        var rows = topic.qs.map(function (q) {
          if (!QL.matches(q[0], term)) return "";
          return row({ text: q[0], type: q[1] }, '<span class="tag is-standard">Benchmarked</span>');
        }).join("");
        if (!rows) return "";
        any = true;
        return '<div class="q-topic"><div class="q-head"><h2 class="text-l5">' + QL.esc(topic.name) + "</h2>" +
          '<span class="q-count">' + topic.qs.length + "</span></div>" +
          '<div class="q-list">' + rows + "</div></div>";
      }).join("");
    } else if (shelf === "org") {
      var rows = org.map(function (q) {
        if (!QL.matches(q.text, term)) return "";
        return row(q, '<span class="tag tag-info">Custom</span>', "Added " + (q.added || "recently"));
      }).join("");
      any = !!rows;
      orgList.innerHTML = rows ? '<div class="q-topic"><div class="q-list">' + rows + "</div></div>" : "";
    } else {
      var rows = mine.map(function (q) {
        if (!QL.matches(q.text, term)) return "";
        return row(q, '<span class="tag tag-info">Custom</span>',
          "Added " + (q.added || "recently") + " · " + (q.avail !== false ? "Available to everyone" : "Only visible to you"));
      }).join("");
      any = !!rows;
      mineList.innerHTML = rows ? '<div class="q-topic"><div class="q-list">' + rows + "</div></div>" : "";
    }
    noResults.hidden = any;
    document.querySelectorAll("[data-add]").forEach(function (b) {
      b.addEventListener("click", function () {
        added[b.getAttribute("data-add")] = true;
        QL.notify("Added to your survey");
        render();
      });
    });
    if (window.Icons) window.Icons.render();
  }

  document.querySelectorAll(".ph-tabs [data-shelf]").forEach(function (t) {
    t.addEventListener("click", function () {
      shelf = t.getAttribute("data-shelf");
      document.querySelectorAll(".ph-tabs .tab").forEach(function (x) { x.classList.toggle("is-active", x === t); });
      render();
    });
  });

  /* write a question here and use it right away: it lands in the personal
     bucket and waits for the coordinator to make it available to everyone */
  btnWrite.addEventListener("click", function () {
    QLQ.openCreate({
      topics: ["Custom content"], defaultTopic: "Custom content", pool: [],
      addNotify: { title: "Question added to your survey",
        desc: "Only you can use it until your coordinator makes it available to everyone." },
      onAdd: function (nq) {
        var obj = { text: nq.text, type: nq.type, added: "Today", by: "You", avail: false };
        mine.unshift(obj);
        added[QL.fill(obj.text)] = true;
        counts();
        render();
        return obj;
      }
    });
  });

  document.getElementById("pkSearch").addEventListener("input", function (e) { term = e.target.value.trim(); render(); });
  document.getElementById("btnBack").addEventListener("click", function () {
    QL.notify("This is where your survey would be", "The survey builder itself isn’t part of this prototype.");
  });

  render();
})();
</script>
</body>
</html>
